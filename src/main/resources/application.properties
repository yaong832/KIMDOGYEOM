spring.application.name=kimdogyeomboard

# 이 PC에서만 접속 허용 (다른 PC 서버와 포트 충돌과는 무관)
server.address=127.0.0.1
server.port=8080
# 재시작 시 이전 로그인 세션 복원 비활성화 (SPRING_SECURITY_CONTEXT 역직렬화 오류 방지)
server.servlet.session.persistent=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:~/kimdogyeom;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${user.home}/kimdogyeom-uploads
