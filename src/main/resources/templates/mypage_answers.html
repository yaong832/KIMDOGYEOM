<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<section class="container my-3">
    <h2 class="form-page-title">내가 단 답변</h2>
    <a th:href="@{/mypage}" class="btn btn-sm btn-outline-secondary mb-3">마이페이지</a>
    <table class="table table-board" th:unless="${#lists.isEmpty(answerList)}">
        <thead><tr><th>질문</th><th>답변 내용</th><th>작성일</th></tr></thead>
        <tbody>
            <tr th:each="a : ${answerList}">
                <td><a th:href="@{|/question/detail/${a.question.id}|}"
                       th:text="${a.question.subject}"></a></td>
                <td th:text="${#strings.abbreviate(a.content, 40)}"></td>
                <td th:text="${#temporals.format(a.createDate, 'yyyy-MM-dd')}"></td>
            </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(answerList)}" class="text-muted">작성한 답변이 없습니다.</p>
</section>
</html>
