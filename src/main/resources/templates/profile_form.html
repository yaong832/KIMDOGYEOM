<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<section class="container my-3">
    <h2 class="form-page-title">프로필 설정</h2>
    <p th:if="${param.updated}" class="alert alert-success">프로필이 저장되었습니다.</p>
    <p th:if="${param.passwordChanged}" class="alert alert-success">비밀번호가 변경되었습니다.</p>

    <div class="row">
        <div class="col-md-6">
            <h5>기본 정보</h5>
            <p class="text-muted">아이디: <span th:text="${member.username}"></span></p>
            <form th:action="@{/member/profile}" th:object="${profileForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label class="form-label">닉네임</label>
                    <input type="text" th:field="*{nickname}" class="form-control"
                           th:classappend="${#fields.hasErrors('nickname')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nickname')}"
                         th:errors="*{nickname}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">이메일</label>
                    <input type="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">소개</label>
                    <textarea th:field="*{bio}" rows="4" class="form-control"
                              th:classappend="${#fields.hasErrors('bio')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('bio')}"
                         th:errors="*{bio}"></div>
                </div>
                <button type="submit" class="btn btn-primary">저장</button>
            </form>
            <div class="mt-4 pt-3 border-top">
                <h5 class="mb-2">계정 보안</h5>
                <p class="text-muted small mb-2">비밀번호는 별도 페이지에서 변경할 수 있습니다.</p>
                <a th:href="@{/member/password}" class="btn btn-outline-secondary btn-sm">비밀번호 변경</a>
            </div>
        </div>
    </div>
</section>
</html>
