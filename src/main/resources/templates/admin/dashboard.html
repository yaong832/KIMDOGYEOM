<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<section class="container my-3">
    <h2 class="form-page-title">관리자 대시보드</h2>
    <div class="stat-row">
        <div class="stat-card"><div class="num" th:text="${totalQuestions}">0</div><div class="label">전체 글</div></div>
        <div class="stat-card"><div class="num" th:text="${totalAnswers}">0</div><div class="label">전체 답변</div></div>
        <div class="stat-card"><div class="num" th:text="${totalMembers}">0</div><div class="label">회원 수</div></div>
        <div class="stat-card stat-pending"><div class="num" th:text="${pendingReports}">0</div><div class="label">미처리 신고</div></div>
        <div class="stat-card stat-pending"><div class="num" th:text="${pendingQuestions}">0</div><div class="label">답변 대기</div></div>
    </div>
    <a th:href="@{/admin/reports}" class="btn btn-warning">신고 관리</a>
    <a th:href="@{/question/list}" class="btn btn-outline-primary">게시판</a>
</section>
</html>
