<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<section class="container my-3">
    <h2 class="form-page-title">신고 관리</h2>
    <a th:href="@{/admin/dashboard}" class="btn btn-sm btn-outline-secondary mb-3">대시보드</a>
    <table class="table table-board" th:unless="${#lists.isEmpty(reports)}">
        <thead>
            <tr><th>유형</th><th>대상ID</th><th>사유</th><th>신고자</th><th>일시</th><th></th></tr>
        </thead>
        <tbody>
            <tr th:each="r : ${reports}">
                <td th:text="${r.targetType}"></td>
                <td th:text="${r.targetId}"></td>
                <td th:text="${r.reason}"></td>
                <td th:text="${r.reporter != null ? r.reporter.nickname : '알 수 없음'}"></td>
                <td th:text="${#temporals.format(r.createDate, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <form th:action="@{|/admin/reports/${r.id}/resolve|}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-sm btn-success">처리완료</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(reports)}" class="text-muted">대기 중인 신고가 없습니다.</p>
</section>
</html>
