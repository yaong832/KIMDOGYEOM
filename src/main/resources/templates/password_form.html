<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<section class="container my-3">
    <h2 class="form-page-title">비밀번호 변경</h2>
    <p class="text-muted mb-4">보안을 위해 주기적으로 비밀번호를 변경하는 것을 권장합니다.</p>
    <p th:if="${param.passwordChanged}" class="alert alert-success">비밀번호가 변경되었습니다.</p>

    <div class="row">
        <div class="col-md-6">
            <form th:action="@{/member/password}" th:object="${passwordChangeForm}" method="post"
                  autocomplete="off">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label class="form-label">현재 비밀번호</label>
                    <input type="password" th:field="*{currentPassword}" class="form-control"
                           autocomplete="current-password"
                           th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}"
                         th:errors="*{currentPassword}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">새 비밀번호</label>
                    <input type="password" th:field="*{newPassword}" class="form-control"
                           autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}"
                         th:errors="*{newPassword}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">새 비밀번호 확인</label>
                    <input type="password" th:field="*{newPassword2}" class="form-control"
                           autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('newPassword2') or #fields.hasErrors('newPasswordMatched')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword2')}"
                         th:errors="*{newPassword2}"></div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('newPasswordMatched')}"
                         th:errors="*{newPasswordMatched}"></div>
                </div>
                <button type="submit" class="btn btn-primary">비밀번호 변경</button>
                <a th:href="@{/member/profile}" class="btn btn-secondary">프로필로 돌아가기</a>
            </form>
        </div>
    </div>
</section>
</html>
