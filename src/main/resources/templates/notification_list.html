<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<section class="container my-3">
    <h2 class="form-page-title">알림</h2>
    <form th:action="@{/notification/read-all}" method="post" class="mb-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="btn btn-sm btn-outline-secondary">모두 읽음</button>
    </form>
    <div th:if="${#lists.isEmpty(notifications)}" class="text-muted">알림이 없습니다.</div>
    <div th:each="n : ${notifications}" class="notification-item"
         th:classappend="${!n.readFlag} ? 'unread' : ''">
        <p class="mb-1" th:text="${n.message}"></p>
        <div class="d-flex gap-2 align-items-center">
            <span class="text-muted small"
                  th:text="${#temporals.format(n.createDate, 'yyyy-MM-dd HH:mm')}"></span>
            <a th:if="${n.link}" th:href="${n.link}" class="btn btn-sm btn-link">바로가기</a>
            <form th:unless="${n.readFlag}" th:action="@{|/notification/read/${n.id}|}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm btn-outline-primary">읽음</button>
            </form>
        </div>
    </div>
</section>
</html>
