<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<section class="container my-3 auth-box">
    <h2 class="form-page-title">회원가입</h2>
    <p class="text-muted mb-4">반도체 장비 Q&amp;A 게시판에 가입하고 질문과 답변에 참여하세요.</p>

    <form th:action="@{/member/signup}" th:object="${memberSignupForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"
             th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
        <div class="mb-3">
            <label for="username" class="form-label">아이디</label>
            <input type="text" th:field="*{username}" id="username" class="form-control"
                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                   placeholder="영문·숫자 조합">
            <div class="invalid-feedback" th:errors="*{username}"></div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" th:field="*{password}" id="password" class="form-control"
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{password}"></div>
        </div>
        <div class="mb-3">
            <label for="password2" class="form-label">비밀번호 확인</label>
            <input type="password" th:field="*{password2}" id="password2" class="form-control"
                   th:classappend="${#fields.hasErrors('password2') or #fields.hasErrors('passwordMatched')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{password2}"></div>
            <div class="invalid-feedback d-block" th:errors="*{passwordMatched}"></div>
        </div>
        <div class="mb-3">
            <label for="nickname" class="form-label">닉네임</label>
            <input type="text" th:field="*{nickname}" id="nickname" class="form-control"
                   th:classappend="${#fields.hasErrors('nickname')} ? 'is-invalid'"
                   placeholder="게시판에 표시될 이름">
            <div class="invalid-feedback" th:errors="*{nickname}"></div>
        </div>
        <button type="submit" class="btn btn-primary">가입하기</button>
        <a th:href="@{/member/login}" class="btn btn-secondary">로그인</a>
    </form>
</section>
</html>
