<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<section class="container my-3">
    <h2 class="form-page-title">질문 수정</h2>
    <form th:action="@{|/question/modify/${question.id}|}" th:object="${questionForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label for="category" class="form-label">카테고리</label>
            <select th:field="*{category}" id="category" class="form-select">
                <option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="subject" class="form-label">제목</label>
            <input type="text" th:field="*{subject}" id="subject" class="form-control"
                   th:classappend="${#fields.hasErrors('subject')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{subject}"></div>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea th:field="*{content}" id="content" rows="10" class="form-control"
                      th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:errors="*{content}"></div>
        </div>
        <button type="submit" class="btn btn-primary">수정하기</button>
        <a th:href="@{|/question/detail/${question.id}|}" class="btn btn-secondary">취소</a>
    </form>
</section>
</html>
