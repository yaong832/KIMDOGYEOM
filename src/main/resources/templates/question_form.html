<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<section class="container my-3">
    <h2 class="form-page-title">질문 등록</h2>
    <p class="text-muted mb-4">반도체 장비 관련 궁금한 점을 질문해 주세요.</p>
    <form th:action="@{/question/create}" th:object="${questionForm}" method="post"
          enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label for="category" class="form-label">카테고리</label>
            <select th:field="*{category}" id="category" class="form-select"
                    th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                <option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{category}"></div>
        </div>
        <div class="mb-3">
            <label for="subject" class="form-label">제목</label>
            <input type="text" th:field="*{subject}" id="subject" class="form-control"
                   th:classappend="${#fields.hasErrors('subject')} ? 'is-invalid'"
                   placeholder="예) 에칭 장비 가동 중 알람 발생">
            <div class="invalid-feedback" th:errors="*{subject}"></div>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea th:field="*{content}" id="content" class="form-control" rows="10"
                      th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"
                      placeholder="장비명, 발생 시점, 오류 코드, 증상 등을 작성해 주세요."></textarea>
            <div class="invalid-feedback" th:errors="*{content}"></div>
        </div>
        <div class="mb-3">
            <label for="files" class="form-label">첨부파일 (선택)</label>
            <input type="file" name="files" id="files" class="form-control" multiple>
        </div>
        <button type="submit" class="btn btn-primary">등록</button>
        <a th:href="@{/question/list}" class="btn btn-secondary">목록</a>
    </form>
</section>
</html>
