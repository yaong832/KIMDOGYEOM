# 테스트 전용 설정 (@ActiveProfiles("test")인 테스트에서만 적용)
# 테스트가 실제 개발 DB(~/kimdogyeom)와 업로드 폴더를 건드리지 않도록
# 메모리 DB와 임시 폴더를 쓴다. 테스트가 끝나면 DB는 사라진다.
spring.datasource.url=jdbc:h2:mem:kimdogyeom-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.show_sql=false
app.upload.dir=${java.io.tmpdir}/kimdogyeom-test-uploads
